                if (filterType === 'hard' && hardQuestions.has(q.id)) result.push({...q, type: 'mcq', topicName: topicsData.find(td=>td.id==topicId)?.title});

            }
            return result;

            let qs = [];

            } else {

            // إخفاء العناوين الفرعية في القسم 8
            if (topicId === 8) {
              return qs.map(q => ({ ...q, subTopic: '' }));

            return qs;

          const scrollToSubTopic = (subTopicName) => {

            if (subTopics.length === 0) return null;

            // دالة للتحقق من اكتمال حل جميع أسئلة العنوان الفرعي
            const isSubTopicComplete = (st) => {
              const stQs = questions.filter(q => q.subTopic === st && !q.isNote);
              if (stQs.length === 0) return false;
              return stQs.every(q => revealedAnswers[q.id]);

            // تقسيم العناوين إلى نصفين لترتيبها بشكل رأسي في عمودين

            const grouped = questions.reduce((acc, q) => {

              acc[group].push(q);

            const sortedGroups = Object.entries(grouped).sort(([a], [b]) => {

              if (b === 'بدون عنوان') return -1;

                                  <td className="p-4 text-center">
                                    <span className={`inline-flex items-center justify-center text-sm font-bold px-3 py-1 rounded-full ${isComplete && !topic.isRandomQuiz ? 'bg-emerald-200 text-emerald-900' : 'bg-[#0A5C47]/20 text-[#064232]'}`}>
                                      {topic.isRandomQuiz ? '10-40' : topic.mcqs}
                                    </span>
                                  </td>
                                  <td className="p-4 text-center">
                                    <span className={`inline-flex items-center justify-center text-sm font-bold px-3 py-1 rounded-full ${isComplete && !topic.isRandomQuiz && topic.written > 0 ? 'bg-emerald-600 text-white' : (topic.written > 0 ? 'bg-[#0A5C47] text-white' : 'bg-stone-300 text-stone-900')}`}>
                                      {topic.written > 0 ? topic.written : '-'}
                                    </span>
                                  </td>
                                  <td className="p-4 text-center">
                                    <button 
                                      onClick={() => handleOpenTopic(topic)}
                                      className={`px-4 py-1.5 rounded-md text-sm font-bold transition-colors flex items-center gap-1 justify-center mx-auto opacity-0 group-hover:opacity-100 ${isComplete && !topic.isRandomQuiz ? 'text-emerald-700 hover:text-emerald-900 hover:bg-emerald-200/50' : 'text-[#0A5C47] hover:text-[#064232] hover:bg-[#0A5C47]/20'}`}
                                      disabled={topic.mcqs === 0 && topic.written === 0}
                                    >
                                      {topic.mcqs === 0 && topic.written === 0 ? 'فارغ' : (isComplete && !topic.isRandomQuiz ? 'مراجعة' : 'بدء')}
                                      {topic.mcqs > 0 && <ChevronLeft size={16} />}
                                    </button>
                                  </td>
                                </tr>
                              );
                            })}
                          </tbody>
                          <tfoot>
                            <tr className="bg-[#064232] text-white font-bold text-lg shadow-md">
                              <td colSpan="2" className="p-4 text-right pr-6">إجمالي الأسئلة في البنك (TOTAL)</td>
                              <td className="p-4 text-center">{totalMCQs}</td>
                              <td className="p-4 text-center">{totalWritten > 0 ? totalWritten : '-'}</td>
                              <td className="p-4"></td>
                            </tr>
                          </tfoot>
                        </table>
                      </div>
                    </div>
                  </div>
                )}

                {currentView === 'quiz-config' && (
                  <div className="space-y-6 animate-in fade-in duration-300 max-w-2xl mx-auto mt-10">
                    <div className="bg-white p-8 rounded-2xl shadow-sm border border-stone-200">
                      <div className="flex items-center gap-3 mb-8 pb-4 border-b border-stone-100">
                        <div className="bg-[#0A5C47]/10 p-3 rounded-full text-[#0A5C47]">
                          <Settings size={28} />
                        </div>
                        <div>
                          <h2 className="text-2xl font-black text-[#064232]">تخصيص الاختبار التراكمي</h2>
                          <p className="text-stone-500 text-sm mt-1">قم بتحديد عدد الأسئلة والمصادر التي تود التدرب عليها</p>
                        </div>
                      </div>
                      
                      <div className="mb-8">
                        <h3 className="text-lg font-bold text-stone-800 mb-4 flex items-center gap-2">
                           <BookOpen size={18} className="text-[#0A5C47]"/>
                           المصادر (Topics):
                        </h3>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          {topicsData.filter(t => !t.isRandomQuiz && t.mcqs > 0).map(t => (
                             <label key={t.id} className={`flex items-center gap-3 p-4 border-2 rounded-xl cursor-pointer transition-all ${quizConfig.topics.includes(t.id) ? 'border-[#0A5C47] bg-[#0A5C47]/5' : 'border-stone-200 hover:border-stone-300 hover:bg-stone-50'}`}>
                                <input 
                                   type="checkbox" 
                                   checked={quizConfig.topics.includes(t.id)}
                                   onChange={(e) => {
                                      setQuizConfig(prev => {
                                         const newTopics = e.target.checked 
                                            ? [...prev.topics, t.id] 
                                            : prev.topics.filter(id => id !== t.id);
                                         return { ...prev, topics: newTopics };
                                      });
                                   }}
                                   className="w-5 h-5 text-[#0A5C47] border-stone-300 rounded focus:ring-[#0A5C47]"
                                />
                                <div className="flex flex-col">
                                  <span className="font-bold text-stone-800">{t.title}</span>
                                  <span className="text-[#0A5C47] text-xs font-bold">{t.mcqs} سؤال متاح</span>
                                </div>
                             </label>
                          ))}
                        </div>
                        {quizConfig.topics.length === 0 && (
                          <p className="text-red-500 text-sm font-bold mt-3">⚠️ يجب اختيار مصدر واحد على الأقل!</p>
                        )}
                      </div>

                      <div className="mb-10 bg-stone-50 p-6 rounded-xl border border-stone-200">
                        <div className="flex justify-between items-center mb-6">
                          <h3 className="text-lg font-bold text-stone-800 flex items-center gap-2">
                             <CheckSquare size={18} className="text-[#0A5C47]"/>
                             عدد الأسئلة المطلوبة:
                          </h3>
                          <span className="bg-[#0A5C47] text-white text-2xl font-black px-4 py-1 rounded-lg shadow-sm" dir="ltr">{quizConfig.count}</span>
                        </div>
                        <input 
                           type="range" 
                           min="10" 
                           max="40" 
                           step="1" 
                           value={quizConfig.count}
                           onChange={(e) => setQuizConfig({...quizConfig, count: parseInt(e.target.value)})}
                           className="w-full cursor-pointer h-2 bg-stone-300 rounded-lg outline-none"
                           style={{ accentColor: '#0A5C47' }}
                        />
                        <div className="flex justify-between text-stone-500 text-sm mt-3 font-bold" dir="ltr">
                           <span>10</span>
                           <span>40 (Max)</span>
                        </div>
                      </div>

                      <div className="flex flex-col sm:flex-row gap-4 pt-4 border-t border-stone-100">
                        <button 
                           onClick={handleStartCustomQuiz}
                           disabled={quizConfig.topics.length === 0}
                           className={`flex-1 py-4 rounded-xl font-bold text-lg transition-all text-white flex justify-center items-center gap-2 ${quizConfig.topics.length === 0 ? 'bg-stone-300 cursor-not-allowed opacity-70' : 'bg-[#064232] hover:bg-[#0A5C47] shadow-md hover:shadow-lg hover:-translate-y-0.5'}`}
                        >
                           <BookOpen size={22} />
                           بدء الاختبار الآن
                        </button>
                        <button 
                           onClick={handleGoBack}
                           className="px-8 py-4 rounded-xl font-bold text-stone-600 bg-white border-2 border-stone-200 hover:bg-stone-50 hover:border-stone-300 transition-all"
                        >
                           رجوع
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {currentView === 'topic' && selectedTopic && (
                  <div className="space-y-6 animate-in fade-in duration-300">
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-stone-200">
                      <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                          <h2 className="text-2xl font-bold text-stone-800" dir="ltr">{selectedTopic.title}</h2>
                          {selectedTopic.isRandomQuiz && <p className="text-stone-500 mt-2 text-sm" dir="rtl">تم تجميع هذا الاختبار خصيصاً لك بناءً على إعداداتك.</p>}
                        </div>
                        <div className="flex gap-3">
                          <div className="bg-[#0A5C47]/10 border border-[#0A5C47]/30 px-4 py-2 rounded-lg text-center">
                            <p className="text-xs text-stone-700 font-bold mb-1">MCQs</p>
                            <p className="text-xl font-bold text-[#064232]">
                               {selectedTopic.isRandomQuiz ? randomQuizQuestions.filter(q=>!q.isNote).length : selectedTopic.mcqs}
                            </p>
                          </div>
                          <div className="bg-[#0A5C47]/20 border border-[#0A5C47]/50 px-4 py-2 rounded-lg text-center">
                            <p className="text-xs text-stone-800 font-bold mb-1">Written</p>
                            <p className="text-xl font-bold text-[#064232]">{selectedTopic.written > 0 ? selectedTopic.written : '-'}</p>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-stone-200 overflow-hidden">
                      <div className="flex border-b border-stone-200">
                        <button
                          className={`flex-1 py-4 px-6 font-medium text-lg flex items-center justify-center gap-2 transition-colors ${activeTab === 'mcq' ? 'bg-[#0A5C47]/10 text-[#064232] border-b-2 border-[#0A5C47]' : 'text-stone-500 hover:bg-stone-50'}`}
                          onClick={() => setActiveTab('mcq')}
                          disabled={selectedTopic.mcqs === 0}
                        >
                          <CheckSquare size={20} />
                          أسئلة الاختيارات
                          <span className="bg-stone-200 text-stone-700 text-xs py-0.5 px-2 rounded-full mr-2">
                             {selectedTopic.isRandomQuiz ? randomQuizQuestions.filter(q=>!q.isNote).length : selectedTopic.mcqs}
                          </span>
                        </button>
                        <button
                          className={`flex-1 py-4 px-6 font-medium text-lg flex items-center justify-center gap-2 transition-colors ${activeTab === 'written' ? 'bg-[#0A5C47]/10 text-[#064232] border-b-2 border-[#0A5C47]' : 'text-stone-500 hover:bg-stone-50'}`}
                          onClick={() => setActiveTab('written')}
                          disabled={selectedTopic.written === 0}
                        >
                          <FileText size={20} />
                          الأسئلة المقالية
                          <span className="bg-stone-200 text-stone-700 text-xs py-0.5 px-2 rounded-full mr-2">
                             {selectedTopic.written}
                          </span>
                        </button>
                      </div>

                      <div className="p-6 bg-stone-50/50">
                        {(activeTab === 'mcq' && selectedTopic.mcqs > 0) || (activeTab === 'written' && selectedTopic.written > 0) ? (
                          <div className="space-y-6">
                            <div className="flex flex-wrap gap-3 mb-4" dir="rtl">
                              <button 
                                onClick={handleRevealTopicAnswers}
                                className="flex items-center gap-2 bg-[#064232] text-white hover:bg-[#0A5C47] px-5 py-2.5 rounded-xl font-bold transition-all shadow-md text-sm"
                              >
                                <CheckCircle2 size={18} />
                                إظهار الحلول
                              </button>
                              <button 
                                onClick={handleResetTopicProgress}
                                className="flex items-center gap-2 bg-[#7F1D1D] text-white hover:bg-[#991B1B] px-5 py-2.5 rounded-xl font-bold transition-all shadow-md text-sm"
                              >
                                <RotateCcw size={18} />
                                مسح الإجابات
                              </button>
                            </div>
                            {renderSubTopicsNav(getTopicQuestions(selectedTopic.id, activeTab === 'mcq' ? 'mcqs' : 'written', selectedTopic.mcqs, selectedTopic.title))}
                            {renderQuestionList(getTopicQuestions(selectedTopic.id, activeTab === 'mcq' ? 'mcqs' : 'written', selectedTopic.mcqs, selectedTopic.title))}
                            {activeTab === 'mcq' && renderTopicScore()}
                          </div>
                        ) : null}
                        
                        {((activeTab === 'mcq' && selectedTopic.mcqs === 0) || (activeTab === 'written' && selectedTopic.written === 0)) && (
                           <div className="text-center py-20 text-stone-400">
                             <p className="text-lg font-medium">لم يتم إدراج أسئلة في هذا القسم بعد.</p>
                           </div>
                        )}
                      </div>
                    </div>
                  </div>
                )}

                {(currentView === 'hard' || currentView === 'notes') && (
                  <div className="space-y-6 animate-in fade-in duration-300">
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-stone-200 flex items-center gap-4">
                      <div className={`p-4 rounded-full ${currentView === 'hard' ? 'bg-[#8B0000]/10 text-[#8B0000]' : 'bg-stone-100 text-stone-600'}`}>
                        {currentView === 'hard' ? <Star size={32} /> : <Bookmark size={32} />}
                      </div>
                      <div>
                        <h2 className="text-2xl font-bold text-stone-800">
                          {currentView === 'hard' ? 'الأسئلة الصعبة (Hard Questions)' : 'ملاحظاتي (My Notes)'}
                        </h2>
                      </div>
                    </div>

                    <div className="space-y-6">
                      {getGlobalQuestions(currentView).length > 0 ? (
                        getGlobalQuestions(currentView).map((q, index) => renderQuestionCard(q, index, true))
                      ) : (
                        <div className="text-center py-20 bg-white rounded-xl border border-stone-200 text-stone-400">
                          <p className="text-lg font-medium">لا توجد أسئلة في هذه القائمة حتى الآن.</p>
                        </div>
                      )}
                    </div>
                  </div>
                )}

              </main>
              
              {scoreModalData && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in-overlay">
                  <div className="bg-white rounded-[24px] p-8 max-w-sm w-full shadow-2xl flex flex-col items-center text-center animate-pop-in">
                    <div className="w-[72px] h-[72px] bg-[#E8EDF2] rounded-full flex items-center justify-center text-[#11314B] mb-6 shadow-sm">
                      <Trophy size={36} strokeWidth={1.5} />
                    </div>
                    <h2 className="text-2xl font-black text-[#11314B] mb-2 font-sans tracking-tight">أحسنت!</h2>
                    <p className="text-[#6B7280] text-sm font-medium mb-6">لقد أتممت إجابة هذا القسم بالكامل</p>
                    
                    <div className="bg-[#F0F4F8] w-full rounded-xl py-5 mb-8 border border-[#E1E7ED]">
                      <div className="text-[52px] leading-none font-black text-[#11314B] mb-2" dir="ltr">{scoreModalData.percentage}%</div>
                      <div className="text-base font-bold text-[#11314B]" dir="ltr">{scoreModalData.correctCount} / {scoreModalData.total}</div>
                    </div>
                    
                    <div className="flex items-center gap-3 w-full">
                      <button 
                        onClick={() => { setScoreModalData(null); handleGoBack(); }}
                        className="flex-1 bg-[#11314B] hover:bg-[#1A4568] text-white font-bold py-3 rounded-xl transition-all shadow-md text-sm flex justify-center items-center"
                      >
                        العودة للفهرس
                      </button>
                      <button 
                        onClick={() => setScoreModalData(null)}
                        className="flex-1 bg-white hover:bg-stone-50 text-[#11314B] border-2 border-[#11314B] font-bold py-2.5 rounded-xl transition-all text-sm flex justify-center items-center"
                      >
                        مراجعة الإجابات
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* Custom Confirm Modal */}
              {confirmAction && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in-overlay" dir="rtl">
                  <div className="bg-white rounded-[24px] p-6 max-w-sm w-full shadow-2xl animate-pop-in text-center border border-stone-200">
                    <div className="w-16 h-16 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-4 border border-amber-100">
                       <Lightbulb size={32} />
                    </div>
                    <h3 className="text-xl font-bold text-stone-800 mb-2">{confirmAction.message}</h3>
                    {confirmAction.subMessage && <p className="text-sm text-stone-500 mb-6 font-medium leading-relaxed">{confirmAction.subMessage}</p>}
                    <div className="flex gap-3">
                      <button
                        onClick={() => {
                          confirmAction.action();
                          setConfirmAction(null);
                        }}
                        className="flex-1 bg-[#0A5C47] hover:bg-[#064232] text-white font-bold py-3 rounded-xl transition-all shadow-sm"
                      >
                        نعم، متأكد
                      </button>
                      <button
                        onClick={() => setConfirmAction(null)}
                        className="flex-1 bg-stone-100 hover:bg-stone-200 text-stone-800 font-bold py-3 rounded-xl transition-all"
                      >
                        إلغاء
                      </button>
                    </div>
                  </div>
                </div>
              )}

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
