<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Lacrimal glands and the tears</title>
<link rel="stylesheet" href="../styles/style.css">
</head>
<body>
<article class="slide layout-gallery">
  <header class="slide-head">
      <p class="eyebrow">Part II &middot; Secretory system</p>
      <h1 class="slide-title">Lacrimal glands and the tears</h1>
      <div class="head-rule"></div>
    </header>
    <div class="slide-body">

      <div class="col grow">
        <div class="gallery c2 tall">
          <figure><img src="../assets/images/lacrimal-glands.jpg" alt="Main orbital and palpebral lacrimal glands"><figcaption class="cap">Main orbital &amp; palpebral lacrimal glands</figcaption></figure>
          <figure><img src="../assets/images/accessory-glands.jpg" alt="Accessory lacrimal glands"><figcaption class="cap">Accessory lacrimal glands of the conjunctiva</figcaption></figure>
        </div>
      </div>
      <div class="col fixed" style="flex:0 0 640px">
        <h2 class="block-title">The tears</h2>
        <ul class="bullets dash">
          <li>A <span class="term">watery isotonic fluid</span>.</li>
          <li><span class="term">pH 7.4</span> (slightly alkaline).</li>
          <li>Formed mainly from <span class="hl">NaCl</span> and contains <span class="hl">lysozyme</span>.</li>
        </ul>
        <div class="note"><strong>N.B.</strong> Lysozyme is the antibacterial component of the aqueous layer.</div>
      </div>

    </div>
  <footer class="slide-foot">
    <span>Part II — Lacrimal system</span>

  </footer>
