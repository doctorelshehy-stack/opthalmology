                setForcedExplanations(new Set(data.forcedExplanations || []));
                setNotes(data.notes || {});
                
                const loadedElimObj = data.eliminatedOptions || {};
                const newElimOpts = {};
                for (const [k, v] of Object.entries(loadedElimObj)) {
                  newElimOpts[k] = new Set(v);
                }
                setEliminatedOptions(newElimOpts);
              }
            } catch (err) {
              console.error("Failed to load local data:", err);
            } finally {
              setIsDataLoaded(true);
            }
          }, []);

          // Save Data to Local Storage
          useEffect(() => {
            if (!isDataLoaded) return;
            
            const saveStateLocally = () => {
              try {
                const elimObj = {};
                for (const [k, v] of Object.entries(eliminatedOptions)) {
                  elimObj[k] = Array.from(v);
                }
                
                const payload = {
                  userAnswers,
                  revealedAnswers,
                  writtenRevealed,
                  hardQuestions: Array.from(hardQuestions),
                  forcedExplanations: Array.from(forcedExplanations),
                  notes,
                  eliminatedOptions: elimObj
                };
                
                localStorage.setItem('ophtha_qb_v3_final', JSON.stringify(payload));
              } catch (err) {
                console.error("Failed to save local data:", err);
              }
            };

            const timeoutId = setTimeout(saveStateLocally, 500); 
            return () => clearTimeout(timeoutId);
          }, [userAnswers, revealedAnswers, writtenRevealed, hardQuestions, forcedExplanations, notes, eliminatedOptions, isDataLoaded]);

          const totalMCQs = topicsData.filter(t => !t.isRandomQuiz).reduce((acc, curr) => acc + curr.mcqs, 0);
          const totalWritten = topicsData.filter(t => !t.isRandomQuiz).reduce((acc, curr) => acc + curr.written, 0);

          const getQuestionsForTopic = (topicId, type) => {
            const topicInfo = topicsData.find(t => t.id === topicId);
            if (!topicInfo) return [];

            if (realQuestionsData[topicId] && realQuestionsData[topicId][type]) {
                return realQuestionsData[topicId][type].map(q => ({...q, topicName: topicInfo.title}));
            }
            return [];
          };

          const generateRandomQuiz = () => {
            let allAvailableQs = [];
            topicsData.filter(t => !t.isRandomQuiz).forEach(topic => {
                const topicQs = getQuestionsForTopic(topic.id, 'mcqs');
                if (topicQs && topicQs.length > 0) {
                    allAvailableQs = [...allAvailableQs, ...topicQs];
                }
            });
            const shuffledAll = allAvailableQs.sort(() => 0.5 - Math.random());
            const selectedQs = shuffledAll.slice(0, 40);
            return selectedQs.map(q => ({ ...q, originalId: q.id, id: `random-${q.id}` }));
          };

          const isTopicComplete = (topic) => {
            if (topic.isRandomQuiz) {
                let mcqsComplete = randomQuizQuestions.filter(q => !q.isNote && revealedAnswers[q.id]).length;
                let totalQs = randomQuizQuestions.filter(q => !q.isNote).length;
                return mcqsComplete === totalQs && totalQs > 0;
            }

            let mcqsComplete = 0;
            let targetCount = topic.mcqs;
            if (realQuestionsData[topic.id] && realQuestionsData[topic.id].mcqs) {
              const validQs = realQuestionsData[topic.id].mcqs.filter(q => !q.isNote);
              mcqsComplete = validQs.filter(q => revealedAnswers[q.id]).length;
              if (validQs.length > 0) {
                 targetCount = validQs.length;
              }
            }

            return mcqsComplete === targetCount && targetCount > 0;
          };

          useEffect(() => {
            if (selectedTopic && activeTab === 'mcq' && selectedTopic.mcqs > 0) {
              const allQuestions = getTopicQuestions(selectedTopic.id, 'mcqs', selectedTopic.mcqs, selectedTopic.title);
              const questions = allQuestions.filter(q => !q.isNote);
              if (questions && questions.length > 0) {
                const isAllAnswered = questions.every(q => revealedAnswers[q.id]);
                const topicKey = selectedTopic.isRandomQuiz ? 'random' : selectedTopic.id;

                if (isAllAnswered && !notifiedTopics.has(topicKey)) {
                  let correctCount = 0;
                  questions.forEach(q => {
                    if (userAnswers[q.id] === q.correct) correctCount++;
                  });
                  const percentage = Math.round((correctCount / questions.length) * 100);

                  const timer = setTimeout(() => {
                    setScoreModalData({ percentage, correctCount, total: questions.length });
                    setNotifiedTopics(prev => { const newSet = new Set(prev); newSet.add(topicKey); return newSet; });
                  }, 800);
                  return () => clearTimeout(timer);
                }
              }
            }
          }, [revealedAnswers, userAnswers, selectedTopic, activeTab]);

          const handleOpenTopic = (topic) => {
            if (topic.isRandomQuiz) {
                setCurrentView('quiz-config');
                return;
            }
            setSelectedTopic(topic);
            setCurrentView('topic');
            setActiveTab(topic.mcqs > 0 ? 'mcq' : 'written');
          };

          const handleStartCustomQuiz = () => {
             let allAvailableQs = [];
             quizConfig.topics.forEach(topicId => {
                const topicQs = getQuestionsForTopic(topicId, 'mcqs');
                if (topicQs && topicQs.length > 0) {
                    allAvailableQs = [...allAvailableQs, ...topicQs];
                }
             });
             
             const maxQs = Math.min(quizConfig.count, allAvailableQs.length);
             const shuffledAll = allAvailableQs.sort(() => 0.5 - Math.random());
             const selectedQs = shuffledAll.slice(0, maxQs);
             
             const finalQs = selectedQs.map(q => ({ ...q, originalId: q.id, id: `random-${q.id}` }));
             
             setRandomQuizQuestions(finalQs);
             
             // تفريغ الإجابات السابقة للاختبار التراكمي
             setUserAnswers(prev => {
                const newObj = { ...prev };
                Object.keys(newObj).forEach(k => { if(k.startsWith('random-')) delete newObj[k]; });
                return newObj;
             });
             setRevealedAnswers(prev => {
                const newObj = { ...prev };
                Object.keys(newObj).forEach(k => { if(k.startsWith('random-')) delete newObj[k]; });
                return newObj;
             });
             setEliminatedOptions(prev => {
                const newObj = { ...prev };
                Object.keys(newObj).forEach(k => { if(k.startsWith('random-')) delete newObj[k]; });
                return newObj;
             });
             setForcedExplanations(prev => {
                const newSet = new Set(prev);
                Array.from(newSet).forEach(k => { if(String(k).startsWith('random-')) newSet.delete(k); });
                return newSet;
             });
             setNotifiedTopics(prev => {
                const newSet = new Set(prev);
                newSet.delete('random');
                return newSet;
             });
             setScoreModalData(null);
             
             const topic8 = topicsData.find(t => t.id === 8);
             setSelectedTopic(topic8);
             setCurrentView('topic');
             setActiveTab('mcq');
          };

          const handleGoBack = () => {
            setCurrentView('dashboard');
            setSelectedTopic(null);
          };

          const handleOptionSelect = (questionId, optionIndex) => {
            if (revealedAnswers[questionId]) return; 
            const eliminatedForQ = eliminatedOptions[questionId] || new Set();
            if (eliminatedForQ.has(optionIndex)) return; 

            setUserAnswers(prev => ({ ...prev, [questionId]: optionIndex }));
            setRevealedAnswers(prev => ({ ...prev, [questionId]: true }));
            setForcedExplanations(prev => { const newSet = new Set(prev); newSet.add(questionId); return newSet; });
          };

          const toggleEliminateOption = (e, questionId, optionIndex) => {
            e.stopPropagation(); 
            if (revealedAnswers[questionId]) return; 
            setEliminatedOptions(prev => {
              const currentEliminated = new Set(prev[questionId] || []);
              if (currentEliminated.has(optionIndex)) currentEliminated.delete(optionIndex);
              else currentEliminated.add(optionIndex);
              return { ...prev, [questionId]: currentEliminated };
            });
          };

          const toggleHardQuestion = (questionId) => {
            setHardQuestions(prev => {
              const newSet = new Set(prev);
              if (newSet.has(questionId)) newSet.delete(questionId);
              else newSet.add(questionId);
              return newSet;
            });
          };

          const toggleExplanation = (questionId) => {
            setForcedExplanations(prev => {
              const newSet = new Set(prev);
              if (newSet.has(questionId)) newSet.delete(questionId);
              else newSet.add(questionId);
              return newSet;
            });
          };

          const toggleNoteEditor = (questionId) => {
            if (editingNoteId === questionId) setEditingNoteId(null);
            else setEditingNoteId(questionId);
          };

          const handleNoteChange = (questionId, text) => {
            setNotes(prev => {
              const newNotes = { ...prev };
              if (text.trim() === '') delete newNotes[questionId];
              else newNotes[questionId] = text;
              return newNotes;
            });
          };

          const handleRevealWritten = (questionId) => {
            setWrittenRevealed(prev => ({ ...prev, [questionId]: true }));
          };

          const handleRetryQuestion = (questionId) => {
            setUserAnswers(prev => { const newObj = {...prev}; delete newObj[questionId]; return newObj; });
            setRevealedAnswers(prev => { const newObj = {...prev}; delete newObj[questionId]; return newObj; });
            setEliminatedOptions(prev => { const newObj = {...prev}; delete newObj[questionId]; return newObj; });
          };

          const handleRevealTopicAnswers = () => {
            if (!selectedTopic) return;
            setConfirmAction({
              message: "هل أنت متأكد من إظهار جميع الحلول في هذا القسم؟",
              subMessage: "سيتم عرض الإجابات الصحيحة والتفسيرات ولن تتمكن من تقييم نفسك بها الآن.",
              action: () => {
                const questions = getTopicQuestions(selectedTopic.id, activeTab === 'mcq' ? 'mcqs' : 'written', selectedTopic.mcqs, selectedTopic.title);
                const qIds = questions.filter(q => !q.isNote).map(q => q.id);
                
                if (activeTab === 'written') {
                    setWrittenRevealed(prev => {
                      const newObj = { ...prev };
                      qIds.forEach(id => newObj[id] = true);
                      return newObj;
                    });
                } else {
                    setRevealedAnswers(prev => {
                      const newObj = { ...prev };
                      qIds.forEach(id => newObj[id] = true);
                      return newObj;
                    });
                    
                    setForcedExplanations(prev => {
                      const newSet = new Set(prev);
                      qIds.forEach(id => newSet.add(id));
                      return newSet;
                    });
                }
              }
            });
          };

          const handleResetTopicProgress = () => {
            if (!selectedTopic) return;
            setConfirmAction({
              message: "هل أنت متأكد من مسح إجاباتك في هذا القسم؟",
              subMessage: "سيتم تصفير كل تقدمك في هذه الأسئلة والبدء من جديد.",
              action: () => {
                const questions = getTopicQuestions(selectedTopic.id, activeTab === 'mcq' ? 'mcqs' : 'written', selectedTopic.mcqs, selectedTopic.title);
                const qIds = questions.map(q => q.id);
                
                if (activeTab === 'written') {
                    setWrittenRevealed(prev => { const newObj = {...prev}; qIds.forEach(id => delete newObj[id]); return newObj; });
                } else {
                    setUserAnswers(prev => { const newObj = {...prev}; qIds.forEach(id => delete newObj[id]); return newObj; });
                    setRevealedAnswers(prev => { const newObj = {...prev}; qIds.forEach(id => delete newObj[id]); return newObj; });
                    setEliminatedOptions(prev => { const newObj = {...prev}; qIds.forEach(id => delete newObj[id]); return newObj; });
                    setForcedExplanations(prev => { const newSet = new Set(prev); qIds.forEach(id => newSet.delete(id)); return newSet; });
                    
                    setNotifiedTopics(prev => { 
                      const newSet = new Set(prev); 
                      newSet.delete(selectedTopic.isRandomQuiz ? 'random' : selectedTopic.id); 
                      return newSet; 
                    });
                    setScoreModalData(null);
                }
              }
            });
          };

          const getGlobalQuestions = (filterType) => {
            let result = [];
            for (const topicId in realQuestionsData) {
              const t = realQuestionsData[topicId];
              t.mcqs?.forEach(q => {
                if (filterType === 'hard' && hardQuestions.has(q.id)) result.push({...q, type: 'mcq', topicName: topicsData.find(td=>td.id==topicId)?.title});
                if (filterType === 'notes' && notes[q.id]) result.push({...q, type: 'mcq', topicName: topicsData.find(td=>td.id==topicId)?.title});
              });
              t.written?.forEach(q => {
                if (filterType === 'hard' && hardQuestions.has(q.id)) result.push({...q, type: 'written', topicName: topicsData.find(td=>td.id==topicId)?.title});
                if (filterType === 'notes' && notes[q.id]) result.push({...q, type: 'written', topicName: topicsData.find(td=>td.id==topicId)?.title});
              });
            }
            return result;
          };

          const getTopicQuestions = (topicId, type, count, title) => {
            let qs = [];
            if (topicId === 8) {
              qs = type === 'mcqs' ? randomQuizQuestions : [];
            } else {
              qs = getQuestionsForTopic(topicId, type);
            }
            
            // إخفاء العناوين الفرعية في القسم 8
            if (topicId === 8) {
              return qs.map(q => ({ ...q, subTopic: '' }));
            }
            
            return qs;
          };

          const scrollToSubTopic = (subTopicName) => {
            const element = document.getElementById(`subtopic-${subTopicName}`);
            if (element) {
              element.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          };

          const renderSubTopicsNav = (questions) => {
            const subTopics = [...new Set(questions.map(q => q.subTopic || 'بدون عنوان'))]
              .filter(st => st !== 'بدون عنوان')
              .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));

            if (subTopics.length === 0) return null;

            // دالة للتحقق من اكتمال حل جميع أسئلة العنوان الفرعي
            const isSubTopicComplete = (st) => {
              const stQs = questions.filter(q => q.subTopic === st && !q.isNote);
              if (stQs.length === 0) return false;
              return stQs.every(q => revealedAnswers[q.id]);
            };

            // تقسيم العناوين إلى نصفين لترتيبها بشكل رأسي في عمودين
            const half = Math.ceil(subTopics.length / 2);
            const col1 = subTopics.slice(0, half);
            const col2 = subTopics.slice(half);

            const renderButton = (st, idx) => {
              const completed = isSubTopicComplete(st);
              
              let btnClass = "w-full px-4 py-3 rounded-lg text-sm font-bold transition-all text-left shadow-sm flex items-center justify-between group border-2 ";
              let dotClass = "w-2 h-2 rounded-full flex-shrink-0 transition-colors ";
              
              if (completed) {
                  // اللون المطلوب عند اكتمال العنوان الفرعي
                  btnClass += "bg-[#5A0E24] border-[#5A0E24] text-white hover:bg-[#4a0b1d] hover:border-[#4a0b1d]";
                  dotClass += "bg-white/50";
              } else {
                  // إبراز الألوان الرسمية للعنوان غير المكتمل
                  btnClass += "bg-[#E8EDF2] border-[#E8EDF2] text-[#2C3947] hover:bg-[#2C3947] hover:border-[#2C3947] hover:text-white";
                  dotClass += "bg-[#2C3947]/40 group-hover:bg-white";
              }

              return (
                <button
                  key={idx}
                  onClick={() => scrollToSubTopic(st)}
                  className={btnClass}
                >
                  <div className="flex items-center gap-3 truncate">
                    <div className={dotClass}></div>
                    <span className="truncate">{st}</span>
                  </div>
                  {completed && <CheckCircle2 size={18} className="text-white flex-shrink-0 ml-2" />}
                </button>
              );
            };

            return (
              <div className="mb-8 bg-white rounded-xl shadow-sm border border-stone-200 overflow-hidden">
                 <div className="w-full text-base font-bold text-white p-4 bg-[#2C3947] border-b border-[#2C3947] flex items-center justify-center" dir="rtl">
                    فهرس العناوين الفرعية
                 </div>
                 <div className="p-5 grid grid-cols-1 sm:grid-cols-2 gap-4" dir="ltr">
                   <div className="flex flex-col gap-3">
                     {col1.map((st, idx) => renderButton(st, idx))}
                   </div>
                   <div className="flex flex-col gap-3">
                     {col2.map((st, idx) => renderButton(st, idx))}
                   </div>
                 </div>
              </div>
            );
          };

          const renderQuestionList = (questions) => {
            const grouped = questions.reduce((acc, q) => {
              const group = q.subTopic || 'بدون عنوان';
              if (!acc[group]) acc[group] = [];
              acc[group].push(q);
              return acc;
            }, {});

            const sortedGroups = Object.entries(grouped).sort(([a], [b]) => {
              if (a === 'بدون عنوان') return 1;
              if (b === 'بدون عنوان') return -1;
              return a.localeCompare(b, undefined, { numeric: true });
            });

            let globalCounter = 0;

            return sortedGroups.map(([groupName, qs], groupIdx) => (
              <div key={groupIdx} id={`subtopic-${groupName}`} className="mb-12 scroll-mt-28">
                {groupName !== 'بدون عنوان' && (
                  <div dir="ltr" className="flex items-center justify-between mb-6 mt-8 bg-[#2C3947] rounded-md border-l-4 border-l-[#427898] border-r-4 border-r-[#427898] py-2 px-4 shadow-sm relative overflow-hidden">
                    <div className="absolute right-0 top-0 bottom-0 w-24 bg-white/5 -skew-x-12 translate-x-4"></div>
                    <div className="flex items-center gap-3 relative z-10">
                      <BookOpen size={20} className="text-[#427898]" />
                      <h3 className="text-xl font-bold text-white tracking-tight">{groupName}</h3>
                    </div>
                    <div className="flex items-center gap-1.5 border border-white/20 px-3 py-1 rounded-md text-white font-bold text-sm relative z-10">
                       <span className="text-white/90">{qs.length}</span>
                       <span>Qs</span>
                    </div>
                  </div>
                )}
                <div className="space-y-6">
                  {qs.map((q) => {
                    const currentIdx = q.isNote ? -1 : globalCounter++;
                    return renderQuestionCard(q, currentIdx);
                  })}
                </div>
              </div>
            ));
          };

          const renderQuestionCard = (q, index, isGlobalView = false) => {
            if (q.isNote) {
              return (
                <div key={q.id} className="bg-[#F0F7F4] p-6 rounded-xl border border-[#0A5C47]/30 shadow-sm relative overflow-hidden transition-all hover:shadow-md">
                  <div className="absolute top-0 right-0 w-2 h-full bg-[#0A5C47]"></div>
                  <div className="flex items-start gap-4">
                    <div className="bg-[#0A5C47]/15 text-[#0A5C47] p-3 rounded-full flex-shrink-0 shadow-sm mt-1">
                      <Lightbulb size={24} />
                    </div>
                    <div className="flex-1 w-full text-stone-800 text-base leading-relaxed">
                      {q.text}
                    </div>
                  </div>
                </div>
              );
            }

            const qIdForState = q.id; 
            const qIdForNotes = q.originalId || q.id; 

            const isWritten = !q.options;
            const isRevealed = isWritten ? writtenRevealed[qIdForState] : revealedAnswers[qIdForState];
            const selectedOption = userAnswers[qIdForState];
            const isCorrectAnswerSelected = selectedOption === q.correct;
            const isHard = hardQuestions.has(qIdForNotes);
            const showExp = forcedExplanations.has(qIdForState);
            const hasNote = !!notes[qIdForNotes];
            const isEditingNote = editingNoteId === qIdForNotes;
            const eliminatedForQ = eliminatedOptions[qIdForState] || new Set();

            const isTargetQ = (selectedTopic?.id === 1 && (index + 1 === 7)) || (selectedTopic?.id === 2 && (index + 1 === 39 || index + 1 === 40 || index + 1 === 46)) || (selectedTopic?.id === 3 && (index + 1 === 19)) || (selectedTopic?.id === 11 && (index + 1 === 4 || index + 1 === 7 || index + 1 === 10));

            return (
              <div key={qIdForState} className="bg-white p-6 rounded-xl border border-stone-200 shadow-sm transition-all">
                {isGlobalView && (
                  <div className="mb-4 text-xs font-bold text-white bg-[#064232] inline-block px-3 py-1 rounded-full">
                    {q.topicName}
                  </div>
                )}
                {q.originalId && !isGlobalView && (
                   <div className="mb-4 text-xs font-bold text-stone-500 bg-stone-100 inline-block px-3 py-1 rounded-full" dir="ltr">
                     Source: {q.topicName}
                   </div>
                )}
                
                <div className="flex items-start gap-4">
                  <div className="flex flex-col items-center gap-2 flex-shrink-0 w-12 relative">
                    <div className="w-10 h-10 rounded-full flex items-center justify-center font-bold text-lg shadow-sm relative z-10 bg-[#0A5C47] text-white">
                      {index + 1}
                    </div>
                    {isTargetQ && !isGlobalView && (
                      <div className="absolute -top-1 -right-1 z-20 text-[14px] drop-shadow-sm" title="محدد بنقطة حمراء">🔴</div>
                    )}
                    {q.source && (
                      <div className="flex flex-col items-center gap-1.5 mt-2 w-full">
                        {q.source.split(',').map(s => s.trim()).filter(s => s).map((s, idx) => {
                          return (
                            <div key={idx} className={`text-[10px] font-bold text-center rounded-md px-1.5 py-1 border shadow-sm w-full leading-tight bg-[#875A3C] text-white border-[#5C3A24]`}>
                              {s}
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                  <div className="flex-1 w-full" dir="ltr">
                    <h3 className={`text-lg font-bold mb-5 leading-relaxed whitespace-pre-line text-stone-800`}>
                      {q.text}
                    </h3>
                    
                    {q.options && (
                      <div className="grid grid-cols-1 gap-3 mb-5">
                        {q.options.map((opt, optIndex) => {
                          const isSelected = selectedOption === optIndex;
                          const isCorrectOption = q.correct === optIndex;
                          const isEliminated = eliminatedForQ.has(optIndex);
                          
                          let optionClass = "flex items-center justify-between p-4 border rounded-lg transition-all duration-200 ";
                          let cursorClass = isRevealed ? "cursor-default" : "cursor-pointer";
                          
                          if (isEliminated && !isRevealed) {
                            optionClass += "bg-stone-100 border-stone-300 opacity-50";
                          } else if (!isRevealed) {
                            optionClass += "bg-white border-stone-200 hover:border-[#0A5C47] hover:bg-stone-50";
                          } else {
                            if (isCorrectOption) {
                              optionClass += "border-emerald-500 bg-emerald-50 ring-2 ring-emerald-500/30";
                            } else if (isSelected && !isCorrectOption) {
                              optionClass += "border-red-500 bg-red-50 ring-2 ring-red-500/30";
                            } else if (isEliminated) {
                              optionClass += "bg-stone-100 border-stone-200 opacity-40";
                            } else {
                              optionClass += "bg-white border-stone-200 opacity-60";
                            }
                          }

                          return (
                            <div 
                              key={optIndex} 
                              className={`${optionClass} ${cursorClass}`}
                              onClick={() => handleOptionSelect(qIdForState, optIndex)}
                            >
                              <div className="flex items-center gap-3">
                                <div className={`w-5 h-5 rounded-full border flex items-center justify-center flex-shrink-0 ${isSelected ? 'border-[#064232] bg-[#064232]' : 'border-stone-400'}`}>
                                  {isSelected && <div className="w-2 h-2 rounded-full bg-white"></div>}
                                </div>
                                <span className={`text-[15px] font-medium ${isEliminated && !isSelected ? 'line-through' : ''} ${isRevealed && isCorrectOption ? 'text-emerald-800' : isRevealed && isSelected && !isCorrectOption ? 'text-red-800' : 'text-stone-700'}`}>
                                  {opt}
                                </span>
                              </div>
                              
                              <div className="flex items-center">
                                {!isRevealed && (
                                  <button 
                                    onClick={(e) => toggleEliminateOption(e, qIdForState, optIndex)}
                                    className={`p-1.5 rounded-md transition-colors ${isEliminated ? 'text-black bg-stone-300' : 'text-stone-400 hover:text-black hover:bg-stone-200'}`}
                                  >
                                    {isEliminated ? <EyeOff size={18} /> : <Eye size={18} />}
                                  </button>

                        getGlobalQuestions(currentView).map((q, index) => renderQuestionCard(q, index, true))
                      ) : (
                        <div className="text-center py-20 bg-white rounded-xl border border-stone-200 text-stone-400">
                          <p className="text-lg font-medium">لا توجد أسئلة في هذه القائمة حتى الآن.</p>
                        </div>
                      )}
                    </div>
                  </div>
                )}

              </main>
              
              {scoreModalData && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in-overlay">
                  <div className="bg-white rounded-[24px] p-8 max-w-sm w-full shadow-2xl flex flex-col items-center text-center animate-pop-in">
                    <div className="w-[72px] h-[72px] bg-[#E8EDF2] rounded-full flex items-center justify-center text-[#11314B] mb-6 shadow-sm">
                      <Trophy size={36} strokeWidth={1.5} />
                    </div>
                    <h2 className="text-2xl font-black text-[#11314B] mb-2 font-sans tracking-tight">أحسنت!</h2>
                    <p className="text-[#6B7280] text-sm font-medium mb-6">لقد أتممت إجابة هذا القسم بالكامل</p>
                    
                    <div className="bg-[#F0F4F8] w-full rounded-xl py-5 mb-8 border border-[#E1E7ED]">
                      <div className="text-[52px] leading-none font-black text-[#11314B] mb-2" dir="ltr">{scoreModalData.percentage}%</div>
                      <div className="text-base font-bold text-[#11314B]" dir="ltr">{scoreModalData.correctCount} / {scoreModalData.total}</div>
                    </div>
                    
                    <div className="flex items-center gap-3 w-full">
                      <button 
                        onClick={() => { setScoreModalData(null); handleGoBack(); }}
                        className="flex-1 bg-[#11314B] hover:bg-[#1A4568] text-white font-bold py-3 rounded-xl transition-all shadow-md text-sm flex justify-center items-center"
                      >
                        العودة للفهرس
                      </button>
                      <button 
                        onClick={() => setScoreModalData(null)}
                        className="flex-1 bg-white hover:bg-stone-50 text-[#11314B] border-2 border-[#11314B] font-bold py-2.5 rounded-xl transition-all text-sm flex justify-center items-center"
                      >
                        مراجعة الإجابات
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* Custom Confirm Modal */}
              {confirmAction && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in-overlay" dir="rtl">
                  <div className="bg-white rounded-[24px] p-6 max-w-sm w-full shadow-2xl animate-pop-in text-center border border-stone-200">
                    <div className="w-16 h-16 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-4 border border-amber-100">
                       <Lightbulb size={32} />
                    </div>
                    <h3 className="text-xl font-bold text-stone-800 mb-2">{confirmAction.message}</h3>
                    {confirmAction.subMessage && <p className="text-sm text-stone-500 mb-6 font-medium leading-relaxed">{confirmAction.subMessage}</p>}
                    <div className="flex gap-3">
                      <button
                        onClick={() => {
                          confirmAction.action();
                          setConfirmAction(null);
                        }}
                        className="flex-1 bg-[#0A5C47] hover:bg-[#064232] text-white font-bold py-3 rounded-xl transition-all shadow-sm"
                      >
                        نعم، متأكد
                      </button>
                      <button
                        onClick={() => setConfirmAction(null)}
                        className="flex-1 bg-stone-100 hover:bg-stone-200 text-stone-800 font-bold py-3 rounded-xl transition-all"
                      >
                        إلغاء
                      </button>
                    </div>
                  </div>
                </div>
              )}

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
